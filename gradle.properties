# The sandboxed/offline dev environments this project builds in cannot
# reliably download JDK toolchains via the foojay-resolver plugin, so point
# Gradle at the GraalVM JDK the Nix flake already provides (see flake.nix,
# which exports GRAALVM_HOME) instead of letting it fetch one.
org.gradle.java.installations.fromEnv=GRAALVM_HOME
org.gradle.java.installations.auto-download=false
